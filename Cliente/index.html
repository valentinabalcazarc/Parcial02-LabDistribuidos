<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente Audio gRPC-Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="suscripciones/tailwind.config.js"></script>
    <style>
        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f7;
        }

        ::-webkit-scrollbar-thumb {
            background: #c7c7cc;
            border-radius: 3px;
        }

        /* ─── Log items ─── */
        #log p {
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        #log p:last-child {
            border-bottom: none;
        }

        /* ─── Misc ─── */
        .texto-tenue {
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body class="bg-[#f5f5f7] text-gray-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
            <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Transmisión de Audio</h1>
            <nav class="flex items-center gap-4">
                <a href="suscripciones.html"
                    class="text-sm font-medium text-gray-600 hover:text-accent transition-colors">Suscríbete</a>
                <a href="cursos.html"
                    class="text-sm font-medium text-gray-600 hover:text-accent transition-colors">Cursos</a>
                <a href="contacto.html"
                    class="text-sm font-medium text-gray-600 hover:text-accent transition-colors">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 space-y-8">

        <!-- Sección principal -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-6">
            <div>
                <h2 class="text-lg font-bold text-gray-900">Transmisión de Audio con gRPC-Web</h2>
                <p class="text-sm text-gray-500 mt-1">La conexión se intentará al servidor ubicado en localhost:8080</p>
            </div>

            <audio id="audio-player" controls class="hidden w-full"></audio>

            <form class="flex flex-wrap items-end gap-4"
                onsubmit="event.preventDefault(); pedirCancion(document.getElementById('song-title').value || 'cancion1.mp3', document.getElementById('format-select').value || 'mp3')">
                <label class="flex flex-col gap-1">
                    <span class="text-sm font-medium text-gray-600">Título de la canción</span>
                    <input id="song-title" type="text" placeholder="cancion1.mp3" value="cancion1.mp3"
                        class="rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition" />
                </label>

                <label class="flex flex-col gap-1">
                    <span class="text-sm font-medium text-gray-600">Formato</span>
                    <select id="format-select"
                        class="rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition">
                        <option value="mp3">mp3</option>
                        <option value="wav">wav</option>
                        <option value="m4a">m4a</option>
                    </select>
                </label>

                <button type="submit"
                    class="rounded-full bg-accent hover:bg-accent-hover active:brightness-90 px-6 py-2.5 font-semibold text-white transition-all shadow-sm">
                    Pedir Canción
                </button>
            </form>
        </section>

        <!-- Estado y bitácora -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-4">
            <h2 class="text-lg font-bold text-gray-900">Bitácora</h2>
            <h3 id="status" class="text-sm font-semibold text-yellow-600">Esperando petición...</h3>

            <!-- Log container -->
            <div id="log" class="text-sm text-gray-600 bg-[#f5f5f7] rounded-xl p-4 h-40 overflow-y-auto space-y-1">
            </div>
        </section>
    </main>

    <script src="bundle.js"></script>
    <script src="streamingAudios/funciones.js"></script>
</body>

</html>

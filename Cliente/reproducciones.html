<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reproducciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="suscripciones/tailwind.config.js"></script>
    <link rel="stylesheet" href="reproducciones/estilos.css">
</head>

<body class="bg-[#f5f5f7] text-gray-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
            <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Mis Reproducciones</h1>
            <nav class="flex items-center gap-4">
                <a href="audios.html"
                    class="text-sm font-medium text-gray-600 hover:text-accent transition-colors">Catálogo de Audios</a>
                <a href="suscripciones.html"
                    class="text-sm font-medium text-gray-600 hover:text-accent transition-colors">Suscripciones</a>
                <a href="reproducciones.html"
                    class="text-sm font-semibold text-accent border-b-2 border-accent pb-0.5">Mis Reproducciones</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 space-y-6">
        <!-- Encabezado -->
        <div class="space-y-3">
            <h2 class="text-2xl font-bold text-gray-900">🎧 Historial de Reproducciones</h2>
            <p id="total-reproducciones" class="text-sm text-gray-500"></p>
        </div>

        <!-- Controles -->
        <div class="flex items-center gap-3 flex-wrap">
            <button id="btn-recargar"
                class="rounded-full border border-gray-300 px-4 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors"
                type="button">
                ↻ Recargar
            </button>
            <button id="btn-limpiar"
                class="rounded-full border border-red-300 px-4 py-1.5 text-sm font-medium text-red-500 hover:bg-red-50 transition-colors"
                type="button">
                🗑️ Limpiar historial
            </button>
        </div>

        <!-- Grid de tarjetas -->
        <div id="lista-reproducciones" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <p class="texto-tenue">Cargando…</p>
        </div>
    </main>

    <!-- Scripts de metadatos (para resolver títulos de audios) -->
    <script src="audios/config.js"></script>
    <script src="audios/tipos.js"></script>
    <script src="audios/api.js"></script>

    <!-- Scripts de la página de reproducciones -->
    <script src="reproducciones/config.js"></script>
    <script src="reproducciones/api.js"></script>
    <script src="reproducciones/app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="suscripciones/tailwind.config.js"></script>
    <link rel="stylesheet" href="suscripciones/estilos.css">
</head>

<body class="bg-[#f5f5f7] text-gray-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
            <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Planes de Suscripción</h1>
            <div class="flex items-center gap-4">
                <div id="estado-servidor"
                    class="text-xs font-medium px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 border border-yellow-200">
                    Consultando servidor…
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 space-y-10">
        <!-- Listar planes de suscripción -->
        <section>
            <div class="flex items-center justify-end mb-4">
                <button id="btn-recargar-suscripciones"
                    class="rounded-full border border-gray-300 px-4 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors"
                    type="button">
                    ↻ Recargar
                </button>
            </div>
            <div id="lista-suscripciones" class="grid gap-4 grid-cols-4">
                <p class="texto-tenue">Cargando suscripciones…</p>
            </div>
        </section>

        <div class="grid gap-8 lg:grid-cols-2">

            <!-- Pagar suscripción -->
            <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-6">
                <h2 class="text-lg font-bold text-gray-900">Pagar suscripción</h2>

                <form id="form-pago" class="space-y-4" autocomplete="off">
                    <label class="block space-y-1">
                        <span class="text-sm font-medium text-gray-600">Suscripción</span>
                        <select id="suscripcion" required
                            class="block w-full rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition">
                        </select>
                    </label>

                    <label class="block space-y-1">
                        <span class="text-sm font-medium text-gray-600">Monto a pagar (COP)</span>
                        <input id="monto" type="text" readonly
                            class="block w-full rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-400 cursor-not-allowed" />
                    </label>

                    <label class="block space-y-1">
                        <span class="text-sm font-medium text-gray-600">Cédula</span>
                        <input id="cedula" type="text" inputmode="numeric" pattern="[0-9]{6,10}" value="1061000000"
                            required
                            class="block w-full rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition" />
                    </label>

                    <label class="block space-y-1">
                        <span class="text-sm font-medium text-gray-600">Nombre del titular</span>
                        <input id="nombre" type="text" value="Estudiante Sistemas Distribuidos" required
                            class="block w-full rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition" />
                    </label>

                    <label class="block space-y-1">
                        <span class="text-sm font-medium text-gray-600">Número de tarjeta</span>
                        <input id="tarjeta" type="text" inputmode="numeric" pattern="[0-9 ]{13,23}"
                            value="4111 1111 1111 1111" required
                            class="block w-full rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition" />
                    </label>

                    <button id="btn-pagar"
                        class="w-full rounded-full bg-accent hover:bg-accent-hover active:brightness-90 px-6 py-2.5 font-semibold text-white transition-all shadow-sm"
                        type="submit">
                        Pagar
                    </button>
                </form>

            </section>

            <!-- Bitácora y resultado -->
            <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-4">
                <h2 class="text-lg font-bold text-gray-900">Bitácora de intentos</h2>
                <ol id="bitacora"
                    class="list-decimal list-inside space-y-1 text-sm text-gray-600 bg-[#f5f5f7] rounded-xl p-4 h-60 overflow-y-auto">
                    <li class="texto-tenue">Aquí se registra cada intento y reintento de pago.</li>
                </ol>
                <div id="resultado" class="resultado oculto"></div>
            </section>
        </div>

        <!-- Consultar transacciones -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-4">
            <h2 class="text-lg font-bold text-gray-900">Consultar transacciones</h2>
            <form id="form-consulta" class="flex flex-wrap items-end gap-4" autocomplete="off">
                <label class="flex flex-col gap-1">
                    <span class="text-sm font-medium text-gray-600">Cédula</span>
                    <input id="cedula-consulta" type="text" inputmode="numeric" pattern="[0-9]{6,10}" value="1061000000"
                        required
                        class="rounded-xl bg-[#f5f5f7] border border-gray-200 px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition" />
                </label>
                <button
                    class="rounded-full bg-accent hover:bg-accent-hover active:brightness-90 px-6 py-2.5 font-semibold text-white transition-all shadow-sm"
                    type="submit">
                    Consultar
                </button>
            </form>
            <div id="resultado-consulta"></div>
        </section>
    </main>

    <script src="suscripciones/config.js"></script>
    <script src="suscripciones/api.js"></script>
    <script src="suscripciones/app.js"></script>
</body>

</html>

spring.application.name=ms-servidorDeReacciones
server.port=${PORT:5000}

# Descubrimiento de servicios (Consul), igual que streaming y metadatos
servicio.nombre=ms-servidorDeReacciones
servicio.host=${SERVICE_HOST:127.0.0.1}
consul.addr=${CONSUL_ADDR:127.0.0.1:8500}

# API Gateway: solo se aceptan peticiones que traigan el token del gateway (X-Gateway-Token).
# Debe coincidir con GATEWAY_SECRET del gateway. Para probar sin gateway: GATEWAY_ENABLED=false
gateway.habilitado=${GATEWAY_ENABLED:true}
gateway.secreto=${GATEWAY_SECRET:secreto-gateway-2026}

# Ruta interna del endpoint WebSocket. El gateway expone /api/reacciones/ws y la reescribe a /reacciones/ws
reacciones.ws.endpoint=${WS_ENDPOINT:/reacciones/ws}

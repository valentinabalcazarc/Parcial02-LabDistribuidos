<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Audios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="admin/tailwind.config.js"></script>
    <link rel="stylesheet" href="admin/estilos.css">
</head>

<body class="bg-[#f5f5f7] text-gray-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-x-4 gap-y-2 px-6 py-4">
            <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Administración de Audios</h1>
            <div class="flex items-center gap-4">
                <nav class="flex items-center gap-4">
                    <a href="#/"
                        class="whitespace-nowrap text-sm font-semibold text-accent border-b-2 border-accent pb-0.5">Registrar audio</a>
                </nav>
                <div id="estado-servidor" role="status"
                    class="whitespace-nowrap text-xs font-medium px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 border border-yellow-200">
                    Consultando servidor…
                </div>
            </div>
        </div>
    </header>

    <!-- Aquí se pintan los tipos de audio, el formulario de registro y la confirmación -->
    <main id="contenido" class="max-w-7xl mx-auto px-6 py-10 space-y-6" aria-live="polite">
        <p class="texto-tenue">Cargando…</p>
    </main>

    <script src="admin/config.js"></script>
    <script src="admin/tipos.js"></script>
    <script src="admin/api.js"></script>
    <script src="admin/app.js"></script>
</body>

</html>
